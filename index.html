<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Zehnerübergang – Addition in drei Schritten</title>

  <style>
    :root {
      --bg: #f5f5f5;
      --card: #ffffff;
      --text: #222;
      --blue: #8fc0ff;
      --blue-dark: #4d8ff5;
      --ok: #cfeecf;
      --bad: #ffd7d7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      background: var(--card);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    h1 { margin: 0 0 8px; }
    .sub { margin: 0 0 18px; color: #555; }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 12px;
      background: var(--blue);
      font-size: 16px;
      cursor: pointer;
    }

    button.primary { background: var(--blue-dark); color: #fff; }
    button:hover { filter: brightness(0.97); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 18px;
      margin-top: 18px;
    }

    .task {
      min-height: 300px;
      padding: 20px 14px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #fafafa;
      border: 2px solid #e4e4e4;
      border-radius: 18px;
    }

    .line {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 27px;
      line-height: 1.6;
    }

    .line + .line { margin-top: 15px; }

    .slot {
      min-width: 56px;
      height: 48px;
      padding: 0 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border-bottom: 4px solid #222;
      font-size: 27px;
      cursor: pointer;
    }

    .slot.small { min-width: 42px; }
    .slot.correct { background: var(--ok); border-radius: 8px; }
    .slot.wrong { background: var(--bad); border-radius: 8px; }

    .heart-target {
      position: relative;
      width: 192px;
      height: 104px;
      margin-left: 2px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .heart-target svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0.38;
      pointer-events: none;
    }

    .heart-front {
      position: relative;
      padding-top: 7px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .pool-title { margin-top: 22px; color: #555; font-size: 17px; }

    .pool {
      min-height: 58px;
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .tile {
      min-width: 58px;
      padding: 12px 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--blue);
      border-radius: 12px;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.08);
      font-size: 24px;
      cursor: pointer;
      user-select: none;
    }

    .tile.selected {
      background: var(--blue-dark);
      color: #fff;
      outline: 3px solid #dbe7ff;
    }

    .msg { min-height: 28px; margin-top: 16px; font-size: 18px; }
    .hint { margin-top: 8px; color: #666; font-size: 14px; }

    @media (max-width: 640px) {
      body { padding: 12px; }
      .wrap { padding: 18px 8px; }
      .grid { grid-template-columns: 1fr; }
      .line { gap: 5px; font-size: 20px; }
      .slot { min-width: 43px; height: 40px; font-size: 22px; }
      .slot.small { min-width: 34px; }
      .heart-target { width: 168px; height: 92px; }
      .heart-front { gap: 5px; padding-top: 5px; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>Addition bis 100 – drei Schritte</h1>

    <p class="sub">
      Wähle unten eine Zahl und tippe anschließend auf den passenden Platz.
    </p>

    <div class="controls">
      <button id="checkBtn" class="primary">Überprüfen</button>
      <button id="clearBtn">Leeren</button>
      <button id="newBtn">Neue 6 Aufgaben</button>
    </div>

    <div id="taskGrid" class="grid"></div>

    <div class="pool-title">Vorgegebene Zahlen zum Einsetzen:</div>
    <div id="pool" class="pool"></div>

    <div id="msg" class="msg"></div>

    <div class="hint">
      Tipp: Rechne zuerst die Zehner dazu. Ergänze danach bis zum nächsten
      Zehner und addiere zuletzt den Rest.
    </div>
  </div>

  <script>
    const state = { tasks: [], selectedTile: null };

    const grid = document.getElementById("taskGrid");
    const pool = document.getElementById("pool");
    const msg = document.getElementById("msg");

    function shuffle(array) {
      const copy = array.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[randomIndex]] = [copy[randomIndex], copy[i]];
      }
      return copy;
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function createTask(a, b) {
      const tensPart = Math.floor(b / 10) * 10;
      const afterTens = a + tensPart;
      const toNextTen = 10 - (afterTens % 10);
      const onesPart = b % 10;
      const rest = onesPart - toNextTen;

      return {
        a, b,
        result: a + b,
        tensPart,
        afterTens,
        toNextTen,
        rest
      };
    }

    function generateTasks(count) {
      const tasks = [];
      const used = new Set();

      while (tasks.length < count) {
        const a = randInt(21, 79);
        if (a % 10 === 0) continue;

        const b = randInt(11, 29);
        const result = a + b;
        if (result > 100) continue;

        const tensPart = Math.floor(b / 10) * 10;
        const afterTens = a + tensPart;
        const toNextTen = 10 - (afterTens % 10);
        const onesPart = b % 10;

        if (afterTens % 10 === 0 || onesPart <= toNextTen) continue;

        const key = `${a}+${b}`;
        if (!used.has(key)) {
          used.add(key);
          tasks.push(createTask(a, b));
        }
      }

      state.tasks = tasks;
    }

    function buildTaskHTML(task, index) {
      return `
        <div class="task" data-task="${index}">
          <div class="line">
            <span>${task.a}</span><span>+</span><span>${task.b}</span><span>=</span>
            <span class="slot" data-answer="${task.result}"></span>
          </div>

          <div class="line">
            <span>${task.a}</span><span>+</span>
            <span class="slot small" data-answer="${task.tensPart}"></span>
            <span>=</span>
            <span class="slot" data-answer="${task.afterTens}"></span>
          </div>

          <div class="line">
            <div class="heart-target">
              <svg viewBox="0 0 180 100" aria-hidden="true">
                <path
                  d="M90 93 L80 84 C35 55 15 42 15 24
                     C15 11 27 3 42 3 C59 3 72 12 90 28
                     C108 12 121 3 138 3 C153 3 165 11 165 24
                     C165 42 145 55 100 84 Z"
                  fill="white" stroke="#666" stroke-width="2">
                </path>
              </svg>

              <div class="heart-front">
                <span>${task.afterTens}</span>
                <span>+</span>
                <span class="slot small" data-answer="${task.toNextTen}"></span>
              </div>
            </div>

            <span>+</span>
            <span class="slot small" data-answer="${task.rest}"></span>
            <span>=</span>
            <span class="slot" data-answer="${task.result}"></span>
          </div>
        </div>
      `;
    }

    function renderTasks() {
      grid.innerHTML = state.tasks.map((task, index) => buildTaskHTML(task, index)).join("");

      document.querySelectorAll(".slot").forEach((slot) => {
        slot.addEventListener("click", () => {
          if (!state.selectedTile) {
            msg.textContent = "Bitte wähle zuerst unten eine Zahl aus.";
            return;
          }

          const previousTileId = slot.dataset.tileId;
          if (previousTileId) {
            const previousTile = document.querySelector(`[data-tile-id="${previousTileId}"]`);
            if (previousTile) previousTile.hidden = false;
          }

          const tile = state.selectedTile;
          slot.textContent = tile.dataset.value;
          slot.dataset.tileId = tile.dataset.tileId;
          slot.classList.remove("correct", "wrong");

          tile.hidden = true;
          tile.classList.remove("selected");
          state.selectedTile = null;
          msg.textContent = "";
        });
      });
    }

    function renderPool() {
      const values = [];

      state.tasks.forEach((task) => {
        values.push(
          task.result,
          task.tensPart,
          task.afterTens,
          task.toNextTen,
          task.rest,
          task.result
        );
      });

      const mixedValues = shuffle(values);
      pool.innerHTML = "";

      mixedValues.forEach((value, index) => {
        const tile = document.createElement("div");
        tile.className = "tile";
        tile.textContent = value;
        tile.dataset.value = value;
        tile.dataset.tileId = `tile-${index}`;

        tile.addEventListener("click", () => {
          document.querySelectorAll(".tile").forEach((otherTile) => {
            otherTile.classList.remove("selected");
          });

          tile.classList.add("selected");
          state.selectedTile = tile;
          msg.textContent = "";
        });

        pool.appendChild(tile);
      });
    }

    function clearAll() {
      document.querySelectorAll(".slot").forEach((slot) => {
        slot.textContent = "";
        slot.dataset.tileId = "";
        slot.classList.remove("correct", "wrong");
      });

      document.querySelectorAll(".tile").forEach((tile) => {
        tile.hidden = false;
        tile.classList.remove("selected");
      });

      state.selectedTile = null;
      msg.textContent = "";
    }

    function checkAll() {
      let allCorrect = true;
      let allFilled = true;

      document.querySelectorAll(".slot").forEach((slot) => {
        const correctAnswer = String(slot.dataset.answer);
        const enteredValue = slot.textContent.trim();

        slot.classList.remove("correct", "wrong");

        if (enteredValue === "") {
          slot.classList.add("wrong");
          allCorrect = false;
          allFilled = false;
        } else if (enteredValue === correctAnswer) {
          slot.classList.add("correct");
        } else {
          slot.classList.add("wrong");
          allCorrect = false;
        }
      });

      if (allCorrect) {
        msg.textContent = "✅ Super! Alles richtig.";
      } else if (!allFilled) {
        msg.textContent = "❌ Einige Felder sind noch leer.";
      } else {
        msg.textContent = "❌ Einige Felder stimmen noch nicht.";
      }
    }

    function newRound() {
      state.selectedTile = null;
      generateTasks(6);
      renderTasks();
      renderPool();
      msg.textContent = "";
    }

    document.getElementById("checkBtn").addEventListener("click", checkAll);
    document.getElementById("clearBtn").addEventListener("click", clearAll);
    document.getElementById("newBtn").addEventListener("click", newRound);

    newRound();
  </script>
</body>
</html>
